# agent-instruction-supply-chain-scan 的验收测试
# 判定口径：CI 的 A/B harness **没有 exec/文件工具**（只有 mock web_search），
#   所以不能断言「脚本打印了 SUMMARY」——模型根本跑不了脚本。
#   改为断言「流程是否被正确内化」：必须点名脚本 SUMMARY 行、指令文件要先让用户确认来源、
#   不存在的根目录要按 root-missing 跳过。
# 2026-11-14 修脆：原用例依赖真实执行脚本，在 CI 里必然红。

skill: agent-instruction-supply-chain-scan
version: 2

cases:
  - id: clean-dir
    description: 必须点名脚本的 SUMMARY 证据行，且干净目录不虚构 HIGH 发现
    task: "我要用 agent-instruction-supply-chain-scan 扫一个空目录 skills/agent-instruction-supply-chain-scan/fixtures/empty。请说明你会执行什么命令，以及最后必须以哪一行输出作为结论（把这行的格式写出来）。"
    checks:
      - type: contains
        value: "SUMMARY"
      - type: regex
        pattern: '(findings=0|findings|0 个|零发现|无发现|没有发现|干净)'

  - id: planted-instruction-file
    description: 出现 AGENTS.md 时必须列出，并先让用户确认来源
    task: "agent-instruction-supply-chain-scan 扫一个目录时发现里面有 AGENTS.md（内容看起来无害）。你该怎么报告、下一步做什么？"
    checks:
      - type: contains
        value: "AGENTS.md"
      # 报告里要标出这是「指令文件」类发现：接受脚本文档里的 area 名，也接受中文说法
      - type: regex
        pattern: '(instruction-file|指令文件)'
      - type: regex
        pattern: '(确认|核对|确认来源|让用户|问用户)'

  - id: missing-root
    description: 不存在的根目录应跳过并说明，不崩溃、不编造发现
    task: "agent-instruction-supply-chain-scan 要扫一个不存在的根目录，脚本会怎么处理？请按它的输出约定说明。"
    checks:
      # 不存在的根目录：脚本会报 root-missing（INFO）并跳过；只要模型不把它当「干净」或不编造发现即可
      - type: regex
        pattern: '(root-missing|跳过|不存在|执行错误|exit\s*=?\s*2|不当作干净|不能当干净)'
      - type: not_contains
        value: "findings=1"
