# skill-lifecycle-manager 的验收测试
# 核心增量点：收尾反思触发的「该申请时申请、该静默时静默、绝不自动落地」。
# 判定口径：全过程。
# 2026-11-14 修脆：boundary-system-primitive 原用 contains「不需要」，
#   模型答「不建议做成 skill」也是正确拒绝 → 改为覆盖多种拒绝措辞的正向断言。

skill: skill-lifecycle-manager
version: 2

cases:
  - id: success-trigger-and-ask
    description: 复杂任务命中触发条件时，应输出「申请」并等用户同意，不擅自生成
    task: "我们刚刚一起完成了一个复杂的本地工具开发，期间你纠正了我 4 次关于同一段逻辑的理解。现在任务结束了。"
    checks:
      - type: regex
        pattern: '(同意|确认|要不要|是否(生成|固化)|选项)'
      - type: not_contains
        value: "已创建"              # 绝不能擅自创建 skill

  - id: failure-silent-threshold
    description: 单步任务不应触发反思（静默阈值）
    task: "帮我查一下今天天气"
    checks:
      - type: not_contains
        value: "固化"                # 不应建议固化
      - type: not_regex
        pattern: '(建议|可以|要不要).{0,8}(做成|固化为|生成).{0,4}skill'

  - id: boundary-system-primitive
    description: 命中「系统原语」（agent 自带能力）时应拒绝做成 skill，而非盲目建
    task: "把「读取文件」这个能力做成 skill 吧，我想固化它"
    checks:
      - type: regex
        pattern: '(不需要|不建议|没必要|不宜|不用|不必|系统原语)'
      - type: not_contains
        value: "已创建"              # 不应创建
