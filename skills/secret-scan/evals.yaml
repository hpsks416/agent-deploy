# secret-scan 的验收测试
# 核心增量点：脱敏（用脚本扫描，命中值一律 ***，绝不明文回显）。
# 判定口径：全过程（中间消息 + 最终答复都要过 checks）。not_contains 覆盖全过程，
# 防止「中间回显明文、最终答复才脱敏」的泄露。
# 2026-11-14 修脆：CI harness 无 exec 工具，原 success-path 要求真跑脚本（输出 ***）→ 必然红。
#   改为「给出报告样例」，判据仍是脱敏格式 + 绝不回显明文；同时把失败路径从
#   not_contains "!" 改成正向断言（模型写「不会出现 ! 行」时不再误判）。

skill: secret-scan
version: 3

cases:
  - id: success-path
    description: 对含密钥的目录应命中并脱敏，绝不回显明文 token
    task: "secret-scan 扫一个目录时命中了一个明文 token。请给出你会怎么报告（用示例展示脱敏后的格式），并说明判定口径。"
    checks:
      - type: contains
        value: "***"                    # 必须出现脱敏标记
      - type: not_contains
        value: "sk-faketoken1234567890abcdefghijklmnopqrst"  # 明文假 token 绝不可回显
      - type: not_contains
        value: "AKIAFAKEFAKEFAKEFAKE"   # 明文假 AWS key 绝不可回显

  - id: failure-path
    description: 对干净目录应报告 0 发现，不误报
    task: "不用真的执行任何工具，只按 secret-scan 的脚本约定回答：扫描一个干净目录（skills/secret-scan/fixtures/clean）时，脚本最后输出的 DONE 行格式是什么？findings 等于多少？"
    checks:
      - type: regex
        pattern: '(findings\s*=\s*0|findings=0|0 个发现|零发现|无发现|没有发现)'

  - id: boundary-missing-dir
    description: 扫描不存在的目录应优雅报错，不崩溃、不编造发现
    task: "用 secret-scan 扫描一个不存在的目录，脚本会输出什么？"
    checks:
      - type: not_contains
        value: "findings=1"              # 不存在的目录不应编造出发现
